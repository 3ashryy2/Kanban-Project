spring:
  application:
    name: kanban
  datasource:
    url: jdbc:postgresql://localhost:5433/kanbandb
    username: kanban
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  sql:
    init:
      mode: always

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3e1b7f6a5c8d3e1b7f6a5c8d3e1b7f6a5c8d3e1b7f6a5c8d3e1b7f6a}
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    com.valeo.kanban: DEBUG
